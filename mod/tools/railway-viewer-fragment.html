<div id="railway-models-046">
  <div class="viz-controls">
    <label class="form-label">Модель
      <select class="form-select" data-model aria-label="Выбрать модель">
        <option value="locomotive">Паровоз</option><option value="coach">Пассажирский вагон</option><option value="train">Полный состав</option><option value="railway_station">Вокзал</option><option value="rail_foundry">Рельсовый цех</option><option value="track">Два пути и поворот</option><option value="rail_hammer">Молот</option><option value="rail_profile">Рельсовый профиль</option><option value="sleeper">Железная шпала</option>
      </select>
    </label>
    <label class="form-check"><input type="checkbox" class="form-check-input" data-cut><span class="form-check-label">Снять крышу</span></label>
  </div>
  <div data-stage role="img" aria-label="Трёхмерная модель. Мышь вращает вид, колесо изменяет масштаб."></div>
  <div class="viz-row"><span data-detail aria-live="polite"></span><span class="text-small text-muted">Мышь — вращение · колесо — масштаб</span></div>
  <p data-error role="alert" hidden></p>
</div>
<style>
#railway-models-046{display:grid;gap:calc(var(--font-size-base)*.75)}
#railway-models-046 [data-stage]{height:490px;background:var(--background);touch-action:none}
#railway-models-046 canvas{display:block;width:100%;height:100%;touch-action:none}
#railway-models-046 .viz-row{justify-content:space-between}
@media(max-width:480px){#railway-models-046 [data-stage]{height:370px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const root=document.getElementById('railway-models-046');
const stage=root.querySelector('[data-stage]'),select=root.querySelector('[data-model]'),cut=root.querySelector('[data-cut]'),detail=root.querySelector('[data-detail]');
const data=__RAIL_DATA__;
try{
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.01,3000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.enablePan=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x70695b,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-40,60,30);scene.add(sun);
const geometry=new THREE.BoxGeometry(1,1,1),object=new THREE.Group();scene.add(object);const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1000);let active='locomotive';
const draw=()=>renderer.render(scene,camera);const materials=[];
for(let i=0;i<data.names.length;i++){
 const texture=new THREE.TextureLoader().load(data.textures[i],draw);texture.magFilter=THREE.NearestFilter;texture.minFilter=THREE.NearestFilter;texture.colorSpace=THREE.SRGBColorSpace;
 const glass=data.names[i].includes('glass');materials.push(new THREE.MeshLambertMaterial({map:texture,transparent:glass,opacity:glass?.65:1,alphaTest:.03,depthWrite:!glass,clippingPlanes:[clip]}));
}
const sizes={locomotive:'Паровоз · около 14 м',coach:'Вагон · 10 мест · проход и тамбуры',train:'Паровоз и два пассажирских вагона',railway_station:'Вокзал · 43 × 65 блоков',rail_foundry:'Отдельный цех · 19 × 27 блоков',track:'Колея 1,5 м · два пути',rail_hammer:'Кузнечный молот',rail_profile:'Рельсовый профиль',sleeper:'Кованая шпала'};
function clipping(){clip.constant=cut.checked?({coach:3.65,train:3.65,locomotive:4.25,railway_station:11.5,rail_foundry:6.5}[active]??1000):1000;draw();}
function load(name,reset=true){
 active=data.models[name]?name:'locomotive';select.value=active;for(const mesh of object.children)mesh.dispose?.();object.clear();const groups=new Map();let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 for(const p of data.models[active]){if(!groups.has(p[0]))groups.set(p[0],[]);groups.get(p[0]).push(p);for(let a=0;a<3;a++){lo[a]=Math.min(lo[a],p[1+a]);hi[a]=Math.max(hi[a],p[4+a]);}}
 const matrix=new THREE.Matrix4(),rotation=new THREE.Quaternion(),position=new THREE.Vector3(),scale=new THREE.Vector3();
 for(const [material,parts] of groups){const mesh=new THREE.InstancedMesh(geometry,materials[material],parts.length);let i=0;
  for(const p of parts){position.set((p[1]+p[4])/2,(p[2]+p[5])/2,(p[3]+p[6])/2);scale.set(p[4]-p[1],p[5]-p[2],p[6]-p[3]);rotation.setFromAxisAngle(new THREE.Vector3(0,1,0),p[7]||0);matrix.compose(position,rotation,scale);mesh.setMatrixAt(i++,matrix);}mesh.instanceMatrix.needsUpdate=true;mesh.computeBoundingSphere();object.add(mesh);
 }
 const cx=(lo[0]+hi[0])/2,cz=(lo[2]+hi[2])/2,cy=(lo[1]+hi[1])/2;object.position.set(-cx,0,-cz);
 if(reset){const span=Math.max(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2]);controls.target.set(0,cy,0);const view=new THREE.Vector3(-1,.65,1.3).normalize().multiplyScalar(span*1.15);camera.position.copy(view).add(new THREE.Vector3(0,cy,0));controls.minDistance=span*.12;controls.maxDistance=span*5;camera.near=Math.max(.005,span/1000);camera.far=span*20;camera.updateProjectionMatrix();controls.update();}
 cut.disabled=!(active in {coach:1,train:1,locomotive:1,railway_station:1,rail_foundry:1});detail.textContent=sizes[active];clipping();
}
function save(){const value={modelContent:{model:active,roofRemoved:cut.checked},privateContent:{camera:camera.position.toArray(),target:controls.target.toArray()}};window.openai?.setWidgetState?.(value)?.catch(()=>{});}
function restore(value){const m=value?.modelContent;if(!m)return;cut.checked=!!m.roofRemoved;load(m.model);const p=value.privateContent;if(p?.camera?.length===3&&p?.target?.length===3){camera.position.fromArray(p.camera);controls.target.fromArray(p.target);controls.update();draw();}}
select.addEventListener('change',()=>{load(select.value);save();});cut.addEventListener('change',()=>{clipping();save();});controls.addEventListener('change',draw);controls.addEventListener('end',save);
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw();}).observe(stage);
load('locomotive');restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
}catch(error){const target=root.querySelector('[data-error]');target.hidden=false;target.textContent='Не удалось открыть 3D: '+error.message;}
</script>
